services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MOYSKLAD_CLIENT_ID: ${MOYSKLAD_CLIENT_ID:-}
      MOYSKLAD_CLIENT_SECRET: ${MOYSKLAD_CLIENT_SECRET:-}
      MOYSKLAD_REDIRECT_URI: ${MOYSKLAD_REDIRECT_URI}
      MOYSKLAD_APP_UID: ${MOYSKLAD_APP_UID:-}
      MOYSKLAD_VENDOR_SECRET_KEY: ${MOYSKLAD_VENDOR_SECRET_KEY:-}
      CZ_MOCK_MODE: ${CZ_MOCK_MODE:-false}
      CZ_API_BASE_URL: ${CZ_API_BASE_URL:-https://markirovka.crpt.ru}
      CZ_AUTH_METHOD: ${CZ_AUTH_METHOD:-cprob_plugin}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
      MONITORING_URL: ${MONITORING_URL:-}
      MONITORING_KEY: ${MONITORING_KEY:-}
      MONITORING_PROJECT: ${MONITORING_PROJECT:-ms_scaner}
      SUPPORT_ERP_ENABLED: ${SUPPORT_ERP_ENABLED:-false}
      SUPPORT_ERP_URL: ${SUPPORT_ERP_URL:-}
      SUPPORT_ERP_KEY: ${SUPPORT_ERP_KEY:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@aximatech.ru}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 -B -s /tmp/celerybeat-schedule
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MOYSKLAD_CLIENT_ID: ${MOYSKLAD_CLIENT_ID:-}
      MOYSKLAD_CLIENT_SECRET: ${MOYSKLAD_CLIENT_SECRET:-}
      MOYSKLAD_APP_UID: ${MOYSKLAD_APP_UID:-}
      MOYSKLAD_VENDOR_SECRET_KEY: ${MOYSKLAD_VENDOR_SECRET_KEY:-}
      CZ_MOCK_MODE: ${CZ_MOCK_MODE:-false}
      CZ_API_BASE_URL: ${CZ_API_BASE_URL:-https://markirovka.crpt.ru}
      CZ_AUTH_METHOD: ${CZ_AUTH_METHOD:-cprob_plugin}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
      MONITORING_URL: ${MONITORING_URL:-}
      MONITORING_KEY: ${MONITORING_KEY:-}
      MONITORING_PROJECT: ${MONITORING_PROJECT:-ms_scaner}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
